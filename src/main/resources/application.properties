spring.application.name=nexus
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/db_nexus?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
# show-sql=false: com o dashboard disparando ~7 chamadas em paralelo, cada uma
# percorrendo listas de matches, o log sincrono de cada SELECT no console
# (ainda mais no Windows) vira gargalo. Ligue de volta pontualmente quando
# precisar inspecionar uma query.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Os @ManyToOne de Match (project, professional) sao EAGER e as listas de
# matches (confirmados, anteriores, ranking, ...) nao faziam JOIN FETCH, entao
# montar o DTO de N matches disparava N+1 SELECTs para project/professional/
# company/skills. batch_fetch_size agrupa esses lazy loads em poucos
# "WHERE id IN (...)". order_inserts/updates + jdbc.batch_size agrupam os
# saves de refreshMatchScore.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=50MB

spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.restart.exclude=static/**,public/**,templates/**
spring.devtools.livereload.enabled=true

api.security.token.secret=${JWT_SECRET}
server.port=8081

# ── Rate limiting (Bucket4j) ────────────────────────────────────────
# Unico botao de ambiente. Os tetos/janelas de cada politica sao decisao
# de produto e ficam em com.main.nexus.ratelimit.RateLimitPolicy.
# Desligue (RATE_LIMIT_ENABLED=false) para dev/local sem atrito ou em
# testes que nao exercitam o limite.
nexus.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=gaiguer2019@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

nexus.mail.from=gaiguer2019@gmail.com
nexus.admin.email=gaiguer2019@gmail.com

locationiq.api.key=${LOCATIONIQ_API_KEY}

# Gemini Developer API (AI Studio, free tier) — nao setar spring.ai.google.genai.project-id
# nem spring.ai.google.genai.location, senao o cliente muda para modo Vertex AI (pago) e
# passa a rejeitar essa api-key.
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# gemini-2.5-flash-lite parou de aceitar contas novas (404 "no longer available to new
# users" da propria API) -> geracao 3.5 e a substituta indicada pelo Google.
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

linkedin.client-id=86imjbsvil4g4m
linkedin.client-secret=${LINKEDIN_CLIENT_SECRET}
linkedin.redirect-uri=http://localhost:8081/api/auth/linkedin/callback
nexus.frontend.base-url=http://localhost:8082

# ── Convite de membro de empresa (multi-usuário) ────────────────────
# Validade do link de convite (token + linha CompanyInvitation).
nexus.company-invite.ttl-days=${COMPANY_INVITE_TTL_DAYS:7}

github.client-id=${GITHUB_CLIENT_ID}
github.client-secret=${GITHUB_CLIENT_SECRET}
github.redirect-uri=http://localhost:8081/api/auth/github/callback

supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.bucket.profile-images=profile-images-nexus
supabase.bucket.resumes=resume-professional-nexus
supabase.bucket.proposal-attachments=proposal-attachments-nexus
# Videos de resposta assincrona de triagem. DIFERENTE DOS TRES ACIMA: este bucket
# tem que ser criado PRIVADO no painel do Supabase -- os outros tres sao publicos e
# servem URL direta, o que e fraco demais para imagem e voz de um candidato. O acesso
# aqui e sempre por signed URL de curta validade (ver SupabaseStorageService).
#
# CONFIGURACAO OBRIGATORIA NO PAINEL DO SUPABASE, ao criar o bucket:
#   - Public bucket: DESLIGADO
#   - File size limit: 50MB (mesmo teto de nexus.screening.video.max-size-bytes abaixo)
#   - Allowed MIME types: video/webm, video/mp4, video/quicktime
# O limite do bucket e a unica trava que o candidato nao consegue contornar -- a
# validacao do backend acontece DEPOIS do upload (o arquivo vai direto do browser
# pro Supabase, sem passar por aqui), entao ela remedia, nao previne.
supabase.bucket.screening-videos=screening-videos-nexus

# ── Video de triagem ─────────────────────────────────────────────────
# Teto absoluto de guarda no backend. O corte real de duracao acontece no
# MediaRecorder do front (Prompt 5/7); aqui so da pra checar TAMANHO, porque
# inspecionar a duracao exigiria abrir o container do arquivo -- dependencia nova,
# desproporcional. Ou seja: um candidato com ferramenta propria consegue enviar um
# video mais longo que o anunciado, desde que caiba em 50MB. Limitacao conhecida e
# aceita (decisao confirmada com o usuario).
nexus.screening.video.max-size-bytes=52428800
# Validade da signed URL de upload -- so precisa cobrir o tempo de subir o arquivo.
nexus.screening.video.upload-url-ttl-seconds=900
# Validade da signed URL de leitura. Curta de proposito: o link vaza junto com
# qualquer print/encaminhamento da tela da empresa, entao ele expira sozinho.
nexus.screening.video.playback-url-ttl-seconds=300
# Validade do link que vai DENTRO do export de dados do titular (LGPD, portabilidade).
# Precisa ser longa: o export e um JSON baixado, um link de 5 minutos ali nasceria morto.
# 7 dias e escolha nossa, nao exigencia legal -- ajuste se a politica de retencao definir outro
# numero (essa politica ainda nao existe; ver a pendencia registrada no Prompt 2/7).
nexus.screening.video.export-url-ttl-seconds=604800

# ── Mercado Pago (camada financeira, Prompt 5) ───────────────────────
# nexus.billing.enabled=false por padrao: o app roda sem credenciais do MP
# (a confirmacao/contador do Prompt 1-3 continua funcionando, so nao cobra).
# Ligue com BILLING_ENABLED=true + as credenciais do seu app sandbox.
nexus.billing.enabled=${BILLING_ENABLED:false}
# Modo simulado (BILLING_SIMULATE=true): exercita todo o fluxo de cobranca SEM
# Mercado Pago -- cartao de teste sem tokenizacao e o Admin decide o resultado da
# cobranca em /admin/commission-charges. So vale quando nao ha credenciais reais.
nexus.billing.simulate=${BILLING_SIMULATE:false}
mercadopago.base-url=${MP_BASE_URL:https://api.mercadopago.com}
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.public-key=${MP_PUBLIC_KEY:}
# Secret do webhook (painel MP > Webhooks). Vazio = nao valida assinatura.
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
# URL publica que o MP chama de volta (ex.: https://<ngrok>/api/payments/mercadopago/webhook).
# Vazia em dev local sem tunel -- a reconciliacao ainda acontece pela resposta
# sincrona do pagamento e pelo job de varredura.
mercadopago.notification-url=${MP_NOTIFICATION_URL:}

# ── eNotas -- NFS-e por comissao paga (Prompt 6) ────────────────────
# NFSE_SIMULATE=true exercita a emissao SEM eNotas (nota ficticia; o Admin marca
# Autorizada/Negada na fila /admin/invoices). So vale sem api-key real.
nexus.nfse.simulate=${NFSE_SIMULATE:false}
enotas.base-url=${ENOTAS_BASE_URL:https://api.enotasgw.com.br}
enotas.api-key=${ENOTAS_API_KEY:}

# Estes ficaram em DEBUG de uma investigação antiga de e-mail/websocket. Com os
# sockets STOMP do chat conectados, messaging/web.socket em DEBUG é escrita
# síncrona constante no console (pior no Windows). De volta a INFO/WARN -- sobe
# pontualmente de novo só quando for investigar e-mail ou o broker STOMP.
logging.level.org.springframework.mail=INFO
logging.level.org.springframework.messaging=WARN
logging.level.org.springframework.web.socket=WARN
logging.level.org.eclipse.angus.mail=INFO
logging.level.jakarta.mail=INFO
logging.level.javax.mail=INFO

# ── LGPD — contato do Encarregado (DPO) ─────────────────────────────
