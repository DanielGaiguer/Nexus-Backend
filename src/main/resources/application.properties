# depois = Admin publica uma nova versao da Politica.
nexus.legal.dpo.name=${LEGAL_DPO_NAME:Daniel Gaiguer}
nexus.legal.dpo.email=${LEGAL_DPO_EMAIL:gaiguer2019@gmail.com}